# Keeps the free Render service awake in the morning, so the built-in scheduler can build the daily drops.
# GitHub throttles frequent cron schedules (a "*/10" cron really ran only every 3-6 h), so instead one run
# pings every 4.5 minutes from its start until 10:00 UTC (11/12 o'clock in Germany). The service sleeps outside that window
# (this also keeps it far below Render's free 750 instance hours per month, which are shared with other free services).
# Drops that fall outside the window are built as soon as the app wakes up (visit or ping).
name: keep-awake
on:
  schedule:
    - cron: '5 3 * * *'
    - cron: '5 5 * * *'
    - cron: '5 7 * * *'
  workflow_dispatch:
concurrency:
  group: keep-awake
  cancel-in-progress: false
env:
  APP_URL: https://cypher-news.onrender.com
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - name: Ping until 10:00 UTC
        run: |
          end=$(date -u -d 'today 10:00' +%s)
          n=0
          while [ "$(date -u +%s)" -lt "$end" ]; do
            curl -fsS -m 90 --retry 2 --retry-delay 15 "$APP_URL/healthz" > /dev/null || echo "ping failed at $(date -u +%H:%M)"
            n=$((n+1)); sleep 270
          done
          echo "done after $n pings"
