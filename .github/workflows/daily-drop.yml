# Keeps the free Hugging Face Space awake so its built-in scheduler can build the daily drops.
# No secrets needed. Change APP_URL if your Space has another name.
name: keep-awake
on:
  schedule: [{ cron: '*/20 * * * *' }]
  workflow_dispatch:
env:
  APP_URL: https://rouvenwieland-cypher-news.hf.space
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS -m 60 --retry 3 --retry-delay 20 "$APP_URL/healthz"
