<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cypher News — Pitch</title>
<link rel="stylesheet" href="deck.css">
</head>
<body>

<canvas id="rain"></canvas>
<div class="grain"></div>
<div class="vignette"></div>

<div id="deck"></div>

<button id="play-btn">PLAY TALK</button>
<div id="mute-indicator">M: MUTED</div>

<div id="speech-bubble" class="speech-cursor"></div>

<div class="speaker-bar-area">
  <div id="speaker-bar">
    <div class="spkr-wrap" id="spkr-ran">
      <span class="spkr-label">Ran</span>
    </div>
    <div class="spkr-wrap" id="spkr-rufus">
      <span class="spkr-label">Rufus</span>
    </div>
    <div class="spkr-wrap" id="spkr-jaro">
      <span class="spkr-label">Jaro</span>
    </div>
  </div>
</div>

<div id="progress-bar"><div id="progress-fill"></div></div>
<div id="page-indicator">01/11</div>
<div id="fs-hint"></div>
<div class="nav-hint">Space = Play/Pause &middot; &larr; &rarr; Manual &middot; M Mute &middot; F Fullscreen &middot; O Overview</div>

<div id="overview"></div>

<script src="script.js"></script>
<script src="audio/manifest.js"></script>
<script src="content.js"></script>
<script src="deck.js"></script>
</body>
</html>
